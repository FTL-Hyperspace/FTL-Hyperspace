name: 'Build macOS'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]  
  workflow_dispatch:
    # Allow manual triggering of the workflow


jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup macOS build environment
        run: buildscripts/ci/setup-macos.sh

      - name: Build all macOS variants
        run: buildscripts/buildall-darwin.sh
        env:
          HS_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HS_BUILD_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hyperspace-macos-binaries
          path: |
            build-darwin-*/Hyperspace.*.dylib
