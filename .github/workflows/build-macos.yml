name: 'Build macOS'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]  
  workflow_dispatch:
    # Allow manual triggering of the workflow


jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup macOS build environment
        run: buildscripts/ci/setup-macos.sh

      - name: Build all macOS variants
        run: buildscripts/buildall-darwin.sh
        env:
          HS_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HS_BUILD_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Short commit hash
        id: commit
        env:
          HASH: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${HASH::8}" >> $GITHUB_OUTPUT

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: hyperspace-macos-binaries-${{ steps.commit.outputs.short }}
          path: |
            build-darwin-*/Hyperspace.*.dylib
            LICENSE
            COPYRIGHT.md

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: hyperspace-macos-symbols-${{ steps.commit.outputs.short }}
          path: |
            build-darwin-*/Hyperspace.*.dylib.symbols
            LICENSE
            COPYRIGHT.md
