name: 'Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.20.1)'
        required: true
        default: '1.x.x'

permissions:
  contents: write

jobs:
  # Gate: check hook signatures before releasing
  check-hooks:
    uses: ./.github/workflows/check-hook-signatures.yml

  prepare:
    needs: check-hooks
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.INSTALLER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INSTALLER_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump version
        run: |
          git config --global user.email "ftl-hyperspace@github.com"
          git config --global user.name "FTL Hyperspace"
          buildscripts/ci/bump-version.sh ${{ inputs.version }}
          git commit -a -m "Bump version to ${{ inputs.version }}"

      - name: Push changes and create tag
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push origin master:master
          git tag v${{ inputs.version }} master
          git push origin v${{ inputs.version }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          body: |
            ## Download Instructions
            - **Linux Only**: Download `FTL.Hyperspace.${{ inputs.version }}-Linux.zip`
            - **Windows Only**: Download `FTL.Hyperspace.${{ inputs.version }}-Windows.zip`
            - **macOS Only**: Download `FTL.Hyperspace.${{ inputs.version }}-MacOS.zip`

            Platform-specific builds will be uploaded automatically.

  build-linux-windows:
    needs: prepare
    uses: ./.github/workflows/release-linux-windows.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  build-macos:
    needs: prepare
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  build-mac-installer:
    needs: build-macos
    uses: ./.github/workflows/release-mac-installer.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
