name: 'Build Windows'
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    # Allow manual triggering of the workflow

jobs:
  build-windows:
    runs-on: ubuntu-latest
    env:
      HS_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
      HS_BUILD_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build debug
        run: buildscripts/windows/build-debugonly-from-docker.sh

      - name: Build release
        run: buildscripts/windows/build-releaseonly-from-docker.sh

      - name: Short commit hash
        id: commit
        env:
          HASH: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${HASH::8}" >> $GITHUB_OUTPUT

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: hyperspace-windows-${{ steps.commit.outputs.short }}
          path: |
            build-windows-*/Hyperspace.dll
            LICENSE
            COPYRIGHT.md

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: hyperspace-windows-symbols-${{ steps.commit.outputs.short }}
          path: |
            build-windows-*/Hyperspace.dll.symbols
            LICENSE
            COPYRIGHT.md
