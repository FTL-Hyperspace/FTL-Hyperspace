name: 'Build Windows'
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    # Allow manual triggering of the workflow

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HS_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
      HS_BUILD_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build debug
        run: buildscripts/windows/build-debugonly-from-docker.sh

      - name: Build release
        run: buildscripts/windows/build-releaseonly-from-docker.sh

      - name: Store output
        uses: actions/upload-artifact@v7
        with:
          name: hyperspace-windows
          path: |
            build-windows-*/Hyperspace.dll
            build-windows-*/Hyperspace.dll.symbols
            LICENSE
            COPYRIGHT.md
